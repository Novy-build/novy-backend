[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[project]
name = "novy-backend"
version = "0.1.0"
description = "FastAPI service for the Novy application builder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.162.6",
    "httpx2==2.16.0",
    "pyjwt==2.15.1",
    "pydantic-settings==2.16.3",
    "pymongo==4.20.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "uvicorn==0.54.0",
]

[tool.uv]
default-groups = []

[tool.uv.build-backend]
module-name = "novy"

[tool.vercel]
entrypoint = "src.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
